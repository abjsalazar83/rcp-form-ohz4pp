name: icons
on:
  push:
    paths: ['_icons/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in _icons/*.b64; do base64 -d "$f" > "$(basename "$f" .b64).png"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add *.png
          git diff --cached --quiet || git commit -m "Decode icons"
          git push
